name: iOS CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    # macos-latest: verify it's carrying an Xcode 26+ toolchain once this
    # actually runs — pin an exact runner/Xcode version if not.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build (no signing)
        run: |
          xcodebuild build \
            -project Lume.xcodeproj \
            -scheme Lume \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO
