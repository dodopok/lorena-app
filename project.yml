name: Lume
options:
  bundleIdPrefix: com.dodopok
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: 6.0
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
    ASSETSCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETSCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    SWIFT_EMIT_LOC_STRINGS: YES
    GENERATE_INFOPLIST_FILE: NO
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "17"
    DEVELOPMENT_TEAM: "R573HPN65Q"
    CODE_SIGN_STYLE: Automatic

targets:
  Lume:
    type: application
    platform: iOS
    sources:
      - path: Lume
      - path: Shared
    resources:
      - path: Lume/Resources/Assets.xcassets
      - path: Lume/Resources/PrivacyInfo.xcprivacy
    entitlements:
      path: Lume/Lume.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.dodopok.lume
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.security.application-groups:
          - group.com.dodopok.lume
    dependencies:
      - target: LumeWidgets
        embed: true
      - target: LumeShare
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dodopok.lume
        PRODUCT_NAME: Lume
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: Lume/Lume.entitlements
        INFOPLIST_FILE: Lume/Info.plist
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Lume

  LumeWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: LumeWidgets
      - path: Shared
    resources:
      - path: LumeWidgets/Resources/Assets.xcassets
    entitlements:
      path: LumeWidgets/LumeWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.dodopok.lume
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dodopok.lume.widgets
        PRODUCT_NAME: LumeWidgets
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: LumeWidgets/LumeWidgets.entitlements
        INFOPLIST_FILE: LumeWidgets/Info.plist
        SKIP_INSTALL: YES

  LumeShare:
    type: app-extension
    platform: iOS
    sources:
      - path: LumeShare
    entitlements:
      path: LumeShare/LumeShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.dodopok.lume
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dodopok.lume.share
        PRODUCT_NAME: LumeShare
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: LumeShare/Info.plist
        CODE_SIGN_ENTITLEMENTS: LumeShare/LumeShare.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES

schemes:
  Lume:
    build:
      targets:
        Lume: all
    run:
      config: Debug
    archive:
      config: Release
